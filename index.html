<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter - Best Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0,212,170,0.5);
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            display: none;
        }
        #gameOver h1 { font-size: 48px; margin-bottom: 20px; color: #ff4444; }
        #gameOver p { font-size: 24px; margin-bottom: 20px; }
        #gameOver button {
            padding: 12px 30px;
            font-size: 18px;
            background: linear-gradient(90deg, #00d4aa, #00a8ff);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: #000;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
    </div>
    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">Play Again</button>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = { x: canvas.width / 2, y: canvas.height - 100, width: 40, height: 40, speed: 5, lives: 3 };
        let bullets = [];
        let enemies = [];
        let stars = [];
        let score = 0;
        let gameRunning = true;
        let keys = {};

        // Create stars
        for (let i = 0; i < 100; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 });
        }

        function drawPlayer() {
            ctx.fillStyle = '#00d4aa';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.height / 2);
            ctx.lineTo(player.x - player.width / 2, player.y + player.height / 2);
            ctx.lineTo(player.x + player.width / 2, player.y + player.height / 2);
            ctx.closePath();
            ctx.fill();
        }

        function drawBullets() {
            bullets.forEach(b => {
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(b.x - 2, b.y, 4, 10);
            });
        }

        function drawEnemies() {
            enemies.forEach(e => {
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(e.x - e.width / 2, e.y - e.height / 2, e.width, e.height);
            });
        }

        function drawStars() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.fillRect(s.x, s.y, s.size, s.size);
                s.y += 0.5;
                if (s.y > canvas.height) s.y = 0;
            });
        }

        function update() {
            if (!gameRunning) return;

            // Player movement
            if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['s']) player.y += player.speed;

            // Clamp player position
            player.x = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, player.x));
            player.y = Math.max(player.height / 2, Math.min(canvas.height - player.height / 2, player.y));

            // Update bullets
            bullets = bullets.filter(b => {
                b.y -= 8;
                return b.y > 0;
            });

            // Spawn enemies
            if (Math.random() < 0.02) {
                enemies.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    width: 30,
                    height: 30,
                    speed: 2 + Math.random() * 2
                });
            }

            // Update enemies
            enemies = enemies.filter(e => {
                e.y += e.speed;
                return e.y < canvas.height;
            });

            // Collision detection
            bullets.forEach((b, bi) => {
                enemies.forEach((e, ei) => {
                    if (Math.abs(b.x - e.x) < e.width / 2 + 2 && Math.abs(b.y - e.y) < e.height / 2 + 5) {
                        bullets.splice(bi, 1);
                        enemies.splice(ei, 1);
                        score += 10;
                        document.getElementById('score').textContent = score;
                    }
                });
            });

            // Enemy hits player
            enemies.forEach((e, ei) => {
                if (Math.abs(e.x - player.x) < e.width / 2 + player.width / 2 &&
                    Math.abs(e.y - player.y) < e.height / 2 + player.height / 2) {
                    enemies.splice(ei, 1);
                    player.lives--;
                    document.getElementById('lives').textContent = player.lives;
                    if (player.lives <= 0) {
                        gameRunning = false;
                        document.getElementById('finalScore').textContent = score;
                        document.getElementById('gameOver').style.display = 'block';
                    }
                }
            });
        }

        function gameLoop() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawStars();
            drawPlayer();
            drawBullets();
            drawEnemies();
            update();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === ' ' || e.key === 'Spacebar') {
                bullets.push({ x: player.x, y: player.y - player.height / 2 });
            }
        });

        document.addEventListener('keyup', e => keys[e.key] = false);

        function restartGame() {
            player = { x: canvas.width / 2, y: canvas.height - 100, width: 40, height: 40, speed: 5, lives: 3 };
            bullets = [];
            enemies = [];
            score = 0;
            gameRunning = true;
            document.getElementById('score').textContent = '0';
            document.getElementById('lives').textContent = '3';
            document.getElementById('gameOver').style.display = 'none';
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        gameLoop();
    </script>
</body>
</html>
